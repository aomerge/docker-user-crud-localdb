version: '3.8'
services:
  postgres:
    image: postgres:15.14
    container_name: userdb
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: userdb
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - userdb_data:/var/lib/postgresql/data
    networks:
        - spring-network
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: myapp:latest
    container_name: myapp_app
    working_dir: /app
    ports:
      - "8082:8082"
    env_file:
      - .env
    depends_on:
      - postgres
    networks:
      - spring-network
volumes:
  userdb_data:

networks:
  spring-network:
    driver: bridge

